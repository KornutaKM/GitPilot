name: Android CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release signing gates
        run: bash scripts/test_release_gates.sh
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, Android lint and debug APK
        env:
          GITPILOT_GITHUB_CLIENT_ID: ${{ vars.GITPILOT_GITHUB_CLIENT_ID }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug bundleRelease "-Pgitpilot.githubClientId=${GITPILOT_GITHUB_CLIENT_ID}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: GitPilot-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: GitPilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release bundle for compile verification
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: GitPilot-release-UNSIGNED
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
