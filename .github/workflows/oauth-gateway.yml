name: OAuth Gateway CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/oauth-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-gateway-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare Worker with offline Node test suite
        run: npm --prefix backend test
      - name: Guard against committed client secret examples
        shell: bash
        run: |
          ! grep -R -n -E 'client_secret[[:space:]]*[:=][[:space:]]*["\x27][A-Za-z0-9]{30,}' backend/src backend/wrangler.toml
